name: AWS Security Audit

on:
  schedule:
    # Daily at 14:00 UTC (09:00 CT)
    - cron: "0 14 * * *"
  workflow_dispatch: {}

permissions:
  id-token: write   # required for OIDC -> AssumeRoleWithWebIdentity
  contents: read

env:
  LOOKBACK_HOURS: 24
  STALE_DAYS: 90
  AWS_DEFAULT_REGION: us-east-1

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Restores the finding-history file from the previous run so the email
      # can tell new findings from ones already open (with a first-seen
      # date). Key always misses (run_id is unique) so restore-keys falls
      # back to the most recent prior save; this run's updated history is
      # saved explicitly at the very end of the job (see the last step),
      # using the split restore/save actions rather than the combined
      # action's automatic post-run save - that save is gated by success(),
      # and a failed run (e.g. a script erroring, or the email failing to
      # send) should still persist whatever history was gathered.
      # Can't commit this file to the repo instead - it's public, and the
      # history would leak account IDs, resource names, and misconfiguration
      # details.
      - uses: actions/cache/restore@v4
        with:
          path: .findings-history
          key: findings-history-${{ github.run_id }}
          restore-keys: |
            findings-history-

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::515517431319:role/github-actions-aws-security-audit
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      - name: Install jq
        run: sudo apt-get update -y && sudo apt-get install -y jq

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Run audit scripts
        run: |
          # -e: a genuine script error (not "found something" - the audit
          # scripts always exit 0 for that, findings are just ISSUE: lines
          # in the output) should fail this step, and therefore the job.
          # Findings alone no longer fail the run - see the summary step
          # below.
          set -euo pipefail
          mkdir -p findings
          for script in scripts/[0-9]*.sh; do
            name="$(basename "$script" .sh)"
            echo "::group::Running $name"
            bash "$script" | tee "findings/${name}.txt"
            echo "::endgroup::"
          done

      - name: Upload findings artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aws-security-findings-${{ github.run_id }}
          path: findings/
          retention-days: 90

      - name: Build email summary
        if: always()
        id: summary
        run: |
          REPORT=$(python3 .github/scripts/build_email_report.py)
          {
            echo "body<<EMAIL_BODY_EOF"
            echo "AWS Security Audit — $(date -u +%Y-%m-%d)"
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "$REPORT"
            echo "EMAIL_BODY_EOF"
          } >> "$GITHUB_OUTPUT"

      # Sends every run regardless of pass/fail, so a clean day still confirms
      # the audit actually ran - not just silence when there's nothing to flag.
      # Requires MAIL_USERNAME/MAIL_PASSWORD repo secrets (a Gmail address +
      # app password, not the account password - see README). This step is
      # NOT continue-on-error: findings alone don't fail the run anymore
      # (see below), but a failed send does - that's the point of emailing
      # findings at all, so it needs to be a real failure signal.
      - name: Email findings
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: AWS Security Audit <${{ secrets.MAIL_USERNAME }}>
          to: jchan023@gmail.com
          subject: "AWS Security Audit: ${{ steps.summary.outputs.new_count }} new, ${{ steps.summary.outputs.existing_count }} existing — run #${{ github.run_number }}"
          body: ${{ steps.summary.outputs.body }}

      # Informational only - does not fail the run. Findings are expected
      # (e.g. this account's admin user legitimately having
      # AdministratorAccess) and are already reported via email above; this
      # job's pass/fail reflects whether the audits and the email actually
      # ran, not whether anything was found.
      - name: Findings summary
        if: always()
        run: |
          COUNT=$(grep -l "ISSUE" findings/*.txt 2>/dev/null | wc -l | tr -d ' ')
          if [ "$COUNT" -gt 0 ]; then
            echo "::notice::$COUNT check(s) have findings - see the email or the uploaded 'aws-security-findings' artifact"
          else
            echo "All clear."
          fi

      # Explicit save, not the combined action's automatic post-run save -
      # that's gated by success() and would never fire on a failed run. This
      # standalone step with if: always() saves unconditionally regardless
      # of job outcome. Must be the LAST step in the job.
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .findings-history
          key: findings-history-${{ github.run_id }}
